# Config for the dead-link-check workflow (.github/workflows/dead-link-check.yml).
# Some legitimate, working sites reject
# automated / non-browser requests with a 403 even though they're fine in a real browser.
# Accepting 403 avoids constant false-positive noise; a truly dead entry usually surfaces
# as a timeout, DNS failure, TLS error, or 404/410 instead, all of which still fail the check.
accept = [200, 202, 206, 403, 429]

max_concurrency = 8
# Generous timeout so a slow host does not flap the check.
timeout = 45
retry_wait_time = 2
max_retries = 3

# No custom user_agent: lychee's default agent is honest, and a spoofed browser string made some
# hosts fail in sibling lists.

# Hosts that block automated requests at the edge go here, each with a comment saying what was
# checked by hand (curl, a browser session) and when, so the exclusion can be re-tested later.
# Prefer fixing or removing a dead entry over excluding it. Empty on purpose: every link in
# this list answered 200 to a curl request on 2026-11-11.
exclude = []
